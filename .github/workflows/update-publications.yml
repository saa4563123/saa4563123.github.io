# ============================================================================
# 논문 목록 자동 갱신 (구글 스칼라 → data/publications.js)
#
# 매일 아침 구글 스칼라 프로필(data/site-data.js 의 links.scholar)을 읽어,
# 논문이 추가·수정되었거나 인용 수가 바뀌었으면 data/publications.js 를 다시 만들어 커밋합니다.
# 바꿀 것이 없으면 아무것도 커밋하지 않습니다.
#
# 바로 반영하고 싶을 때: GitHub 저장소 → Actions → update-publications → Run workflow
# 스칼라가 일시적으로 막으면 노란 경고만 남기고 다음 날 다시 시도합니다 (사이트는 이전 목록 그대로).
# 빨간 X 는 페이지 구조가 바뀌는 등 사람이 확인해야 할 때만 뜹니다.
# ============================================================================
name: update-publications

on:
  schedule:
    - cron: "17 21 * * *"   # 매일 06:17 KST (= UTC 21:17). 정각은 GitHub 가 붐벼 지연되므로 피함
  workflow_dispatch: {}     # Actions 탭에서 수동 실행

permissions:
  contents: write
  pages: write

concurrency:
  group: update-publications
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: 구글 스칼라에서 논문 목록 받기
        run: python3 scripts/update_publications.py

      - name: 변경 사항 커밋
        id: commit
        run: |
          if [ -n "$(git status --porcelain data/publications.js)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/publications.js
            git commit -m "자동: 구글 스칼라 논문 목록 갱신"
            git pull --rebase origin main
            git push
            echo "changed=1" >> "$GITHUB_OUTPUT"
          else
            echo "변경 없음 — 커밋 생략"
          fi

      # 봇 커밋은 Pages 자동 배포를 건너뛸 수 있어 배포를 직접 요청합니다 (SER Lab 사이트와 같은 방식).
      # 실패해도 치명적이지 않음: 다음 커밋 때 함께 반영됩니다.
      - name: Pages 재배포 요청
        if: steps.commit.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "(요청 실패 — 다음 커밋 때 반영됨)"
